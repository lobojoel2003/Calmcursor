name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Build identification baked into every binary (see crates/calmcursor-core/build.rs).
  CALMCURSOR_BUILD_NUMBER: ${{ github.run_number }}
  CALMCURSOR_GIT_SHA: ${{ github.sha }}
  CALMCURSOR_CHANNEL: ci

jobs:
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/version.py check

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the frontend (embedded by the app crate)
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: CLI smoke test
        shell: bash
        run: |
          cargo run -q -p calmcursor-cli --locked -- --version
          cargo run -q -p calmcursor-cli --locked -- simulate --seconds 3
          cargo run -q -p calmcursor-cli --locked -- status

  package:
    name: Package smoke test (Linux .deb)
    runs-on: ubuntu-22.04
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build a debug .deb
        working-directory: app
        run: |
          npm ci
          npx tauri build --debug --bundles deb
      - name: Inspect the package
        run: |
          deb=$(ls target/debug/bundle/deb/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee contents.txt
          grep -q 'usr/lib/udev/rules.d/70-calmcursor.rules' contents.txt
          grep -q 'usr/bin/calmcursor' contents.txt
